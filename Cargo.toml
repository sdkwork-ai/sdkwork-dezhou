[workspace]
resolver = "2"
members = [
    "crates/sdkwork-api-dezhou-assembly",
    "crates/sdkwork-api-dezhou-standalone-gateway",
    "crates/sdkwork-dezhou-service-host",
    "crates/sdkwork-dezhou-database-host",
    "crates/sdkwork-dezhou-table-service",
    "crates/sdkwork-dezhou-table-repository-sqlx",
    "crates/sdkwork-routes-table-app-api",
    "crates/sdkwork-routes-table-backend-api",
]

[workspace.package]
rust-version = "1.85"
edition = "2021"
version = "0.1.0"

[workspace.lints.rust]
# RUST_CODE_SPEC.md section 13 baseline.
# Deny-tier lints (unsafe_code, panic, unwrap_used, expect_used, pedantic) are
# promoted per crate together with their cleanup: enabling them fleet-wide
# today floods or fails builds that have not paid that debt yet.
unsafe_op_in_unsafe_fn = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
exit = "warn"

[workspace.dependencies]
sdkwork_api_dezhou_standalone_gateway = { package = "sdkwork-api-dezhou-standalone-gateway", path = "crates/sdkwork-api-dezhou-standalone-gateway" }
sdkwork_api_dezhou_assembly = { package = "sdkwork-api-dezhou-assembly", path = "crates/sdkwork-api-dezhou-assembly" }
sdkwork_dezhou_service_host = { package = "sdkwork-dezhou-service-host", path = "crates/sdkwork-dezhou-service-host" }
sdkwork_dezhou_database_host = { package = "sdkwork-dezhou-database-host", path = "crates/sdkwork-dezhou-database-host" }
sdkwork_dezhou_table_service = { package = "sdkwork-dezhou-table-service", path = "crates/sdkwork-dezhou-table-service" }
sdkwork_dezhou_table_repository_sqlx = { package = "sdkwork-dezhou-table-repository-sqlx", path = "crates/sdkwork-dezhou-table-repository-sqlx" }
sdkwork_routes_table_app_api = { package = "sdkwork-routes-table-app-api", path = "crates/sdkwork-routes-table-app-api" }
sdkwork_routes_table_backend_api = { package = "sdkwork-routes-table-backend-api", path = "crates/sdkwork-routes-table-backend-api" }
sdkwork-web-core = { path = "../sdkwork-web-framework/crates/sdkwork-web-core" }
sdkwork-web-axum = { path = "../sdkwork-web-framework/crates/sdkwork-web-axum" }
sdkwork-web-bootstrap = { path = "../sdkwork-web-framework/crates/sdkwork-web-bootstrap" }
sdkwork-web-contract = { path = "../sdkwork-web-framework/crates/sdkwork-web-contract" }
sdkwork-iam-web-adapter = { path = "../sdkwork-iam/crates/sdkwork-iam-web-adapter" }
sdkwork_iam_context_service = { package = "sdkwork-iam-context-service", path = "../sdkwork-iam/crates/sdkwork-iam-context-service" }
sdkwork-database-config = { path = "../sdkwork-database/crates/sdkwork-database-config" }
sdkwork-database-lifecycle = { path = "../sdkwork-database/crates/sdkwork-database-lifecycle" }
sdkwork-database-spi = { path = "../sdkwork-database/crates/sdkwork-database-spi" }
sdkwork-database-sqlx = { path = "../sdkwork-database/crates/sdkwork-database-sqlx", features = ["postgres", "sqlite"] }
sdkwork-utils-rust = { path = "../sdkwork-utils/packages/sdkwork-utils-rust" }
async-trait = "0.1"
axum = "0.8"
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "derive"] }
tokio = { version = "1.51", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["cors"] }
