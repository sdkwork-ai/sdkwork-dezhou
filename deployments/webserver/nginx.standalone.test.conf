# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.standalone.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/dezhou/webserver.pid;
error_log /var/log/sdkwork/dezhou/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server 127.0.0.1:8080;
    }
    server {
        listen 80;
        server_name dezhou-test.sdkwork.com dezhou-test.birdcoder.com dezhou-test.dtupay.com dezhou-test.sdkwork.cn dezhou-test.birdcoder.cn dezhou-test.dtupay.cn dezhou-test.skubc.com dezhou-test.skubc.cn dezhou-test.zowalk.com dezhou-test.zowalk.cn dezhou-test.offer86.com dezhou-test.offer86.cn dezhou-test.86offer.com dezhou-test.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
