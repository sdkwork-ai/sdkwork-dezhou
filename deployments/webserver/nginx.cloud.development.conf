# Generated by the SDKWork web server standard (SDKWORK_WEBSERVER_SPEC.md)
# from server.common.toml + server.cloud.toml; do not edit by hand.
user sdkwork;
worker_processes auto;
pid /run/sdkwork/dezhou/webserver.pid;
error_log /var/log/sdkwork/dezhou/webserver/error.log warn;
events {
    worker_connections 1024;
}
http {
    sendfile on;
    keepalive_timeout 75;
    client_max_body_size 1100m;
    server_tokens off;
    gzip on;
    include snippets/adaptive-web.maps.conf;
    upstream gateway {
        least_conn;
        keepalive 32;
        server sdkwork-api-cloud-gateway:8080;
    }
    server {
        listen 80;
        server_name dezhou-dev.sdkwork.com dezhou-dev.birdcoder.com dezhou-dev.dtupay.com dezhou-dev.sdkwork.cn dezhou-dev.birdcoder.cn dezhou-dev.dtupay.cn dezhou-dev.skubc.com dezhou-dev.skubc.cn dezhou-dev.zowalk.com dezhou-dev.zowalk.cn dezhou-dev.offer86.com dezhou-dev.offer86.cn dezhou-dev.86offer.com dezhou-dev.86offer.cn;
        include snippets/gateway-locations.nonproduction.conf;
    }
}
