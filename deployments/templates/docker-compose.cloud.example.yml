# Shared log rotation policy (OPERATIONS_SPEC.md §2.3): every service rotates
# at 10MB, keeping 3 files, so container logs cannot fill the host disk.
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  dezhou-api:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile.dezhou-api
    ports:
      - "8096:8096"
    environment:
      SDKWORK_DATABASE_ENGINE: postgresql
      SDKWORK_DATABASE_HOST: postgres
      SDKWORK_DATABASE_PORT: "5432"
      SDKWORK_DATABASE_NAME: sdkwork_ai_prod
      SDKWORK_DATABASE_SCHEMA: sdkwork_ai_prod
      SDKWORK_DATABASE_USERNAME: sdkwork_ai_prod
      SDKWORK_DATABASE_PASSWORD_FILE: /etc/sdkwork/database/database.secret
      SDKWORK_DATABASE_SSL_MODE: require
      DEZHOU_REPOSITORY_MODE: sqlx
      SDKWORK_DEZHOU_APP_ROOT: /app
    volumes:
      # Workspace database secret (§7.3); operator must provision the file.
      - /etc/sdkwork/database/database.secret:/etc/sdkwork/database/database.secret:ro
    depends_on:
      - postgres
    logging: *default-logging

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sdkwork_ai_prod
      POSTGRES_PASSWORD: change-me   # placeholder; real secret lives at /etc/sdkwork/database/database.secret
      POSTGRES_DB: sdkwork_ai_prod
    ports:
      - "5433:5432"
    logging: *default-logging
